<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Manara</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/connexion.css}">
</head>

<body>

<div th:replace="fragments/header :: header"></div>


<main class="login-page">
    <div class="login-container">
        <div class="login-card">


            <div class="login-header">
                <h1 class="login-title">Bon retour ! <span class="wave-emoji">👋</span></h1>
                <p class="login-subtitle">Connectez-vous pour accéder à votre espace parent.</p>
            </div>


            <form th:action="@{/connexion}" method="post" class="login-form" novalidate>

                <div class="form-group">
                    <label for="email" class="form-label">
                        Adresse courriel <span class="required">*</span>
                    </label>
                    <input type="email" id="email" name="email" class="form-input"
                           placeholder="exemple@courriel.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">
                        Mot de passe <span class="required">*</span>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" class="form-input"
                               placeholder="Entrez votre mot de passe" required autocomplete="current-password">
                        <button type="button" class="toggle-password" aria-label="Afficher le mot de passe" onclick="togglePassword()">
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <a th:href="@{/mot-de-passe-oublie}" class="forgot-link">Mot de passe oublié ?</a>
                </div>

                <!-- Erreur (affiché conditionnellement) -->
                <div th:if="${error}" class="login-error">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    <span th:text="${error}">Identifiants incorrects.</span>
                </div>

                <button type="submit" class="btn-login">
                    Se connecter
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>

            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script>
    function togglePassword() {
        const input  = document.getElementById('password');
        input.type   = input.type === 'password' ? 'text' : 'password';
        document.querySelector('.eye-icon').classList.toggle('hidden');
        document.querySelector('.eye-off-icon').classList.toggle('hidden');
    }
</script>

</body>
</html>

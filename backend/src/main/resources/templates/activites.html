<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activités — Manara</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboardParent.css}">
    <link rel="stylesheet" th:href="@{/css/activites.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="dashboard-layout">

    <div th:replace="fragments/sidebar :: sidebar('activites')"></div>

    <main class="dashboard-main">
        <div class="activites-header">
            <h1 class="activites-title">Nos Activités</h1>
            <p class="activites-subtitle">Explorez et inscrivez vos enfants aux activités du Centre Manara</p>
        </div>

        <!-- Barre de recherche -->
        <div class="search-bar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Rechercher une activité..." onkeyup="filterActivities()">
        </div>

        <!-- Grille des activites -->
        <div class="activites-grid">

            <!-- Si aucune activite -->
            <div th:if="${activities == null or activities.isEmpty()}" style="grid-column:1/-1">
                <p style="text-align:center;color:#666;padding:2rem;">Aucune activité disponible pour le moment.</p>
            </div>

            <!-- Boucle sur les activites depuis la BD -->
            <div th:each="activity : ${activities}" class="activite-card"
                 th:data-name="${activity.name.toLowerCase()}"
                 th:data-id="${activity.id}">
                <div class="card-image">
                    <img th:if="${activity.activityImagePath != null}"
                         th:src="@{${activity.activityImagePath}}"
                         th:alt="${activity.name}">
                    <img th:if="${activity.activityImagePath == null}"
                         th:src="@{/images/default-activity.jpg}"
                         alt="Activité">
                </div>
                <div class="card-body">
                    <div class="card-top">
                        <h3 class="card-name" th:text="${activity.name}">Activité</h3>
                        <div class="card-badges">
                            <span th:if="${activity.sessions != null and !activity.sessions.isEmpty()}"
                                  class="badge date"
                                  th:text="${#temporals.format(activity.sessions[0].dateTimeStart, 'yyyy-MM-dd')}">
                                Date
                            </span>
                        </div>
                    </div>
                    <p class="card-desc" th:text="${activity.description} ?: 'Aucune description disponible.'">Description</p>
                    <button class="btn-inscrire"
                            th:data-activity-id="${activity.id}"
                            th:data-activity-name="${activity.name}"
                            onclick="openInscrireModal(this)">
                        Inscrire mon enfant
                    </button>
                </div>
            </div>
        </div>

        <div class="no-results" id="noResults">Aucune activité trouvée.</div>
    </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<!-- Modal pour choisir quel enfant inscrire -->
<div class="modal-overlay" id="inscrireOverlay" onclick="closeInscrireModal(event)">
    <div class="modal-inscrire" onclick="event.stopPropagation()">
        <div class="modal-inscrire-header">
            <h2 id="inscrireTitle">Inscrire à : Activité</h2>
            <button class="modal-close" onclick="closeInscrireModal()">&times;</button>
        </div>
        <p class="modal-inscrire-subtitle">Choisissez l'enfant à inscrire</p>
        <div class="enfants-choices" id="enfantsChoices">

            <!-- Si aucun enfant -->
            <div th:if="${children == null or children.isEmpty()}">
                <p class="no-enfants-msg">Aucun enfant enregistré. <a th:href="@{/dashboardParent/enfants}">Ajouter un enfant</a></p>
            </div>

            <!-- Liste des enfants du parent -->
            <div th:each="child : ${children}" class="enfant-choice"
                 th:data-child-id="${child.id}">
                <div class="choice-avatar" th:text="${child.firstName.charAt(0)}">A</div>
                <div class="choice-info">
                    <strong th:text="${child.firstName + ' ' + child.lastName}">Enfant</strong>
                    <span th:text="${child.getAge() + ' ans'}">0 ans</span>
                </div>
                <form th:action="@{/dashboardParent/activites/inscrire}" method="post" style="display:inline">
                    <input type="hidden" name="childId" th:value="${child.id}">
                    <input type="hidden" name="activityId" class="activity-id-input" value="">
                    <button type="submit" class="btn-choice-inscrire">Inscrire</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- Bouton menu mobile -->
<button class="mobile-menu-btn" onclick="toggleSidebar()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
    const $ = id => document.getElementById(id);

    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.sidebar-overlay').classList.toggle('open');
    }

    // Filtrer les activites par nom
    function filterActivities() {
        const q = $('searchInput').value.toLowerCase();
        let visible = 0;
        document.querySelectorAll('.activite-card').forEach(c => {
            const match = c.dataset.name.includes(q);
            c.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        $('noResults').style.display = visible ? 'none' : 'block';
    }

    // Ouvrir le modal d'inscription avec le nom de l'activite
    function openInscrireModal(btn) {
        const activityId = btn.dataset.activityId;
        const activityName = btn.dataset.activityName;

        $('inscrireTitle').textContent = 'Inscrire à : ' + activityName;

        // Mettre l'activityId dans tous les formulaires caches
        document.querySelectorAll('.activity-id-input').forEach(input => {
            input.value = activityId;
        });

        $('inscrireOverlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    // Fermer le modal
    function closeInscrireModal(event) {
        if (event && event.target !== $('inscrireOverlay')) return;
        $('inscrireOverlay').classList.remove('open');
        document.body.style.overflow = '';
    }
</script>
</body>
</html>

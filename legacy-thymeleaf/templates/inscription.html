<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Manara</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/inscription.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<main class="register-page">
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1 class="register-title">Créer votre compte</h1>
            </div>

            <!-- Formulaire d'inscription avec validation JS -->
            <form th:action="@{/inscription}" method="post" class="register-form" id="registerForm" novalidate>

                <!-- Section 1 : Informations personnelles -->
                <fieldset class="form-section">
                    <legend class="section-legend">Informations personnelles</legend>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="prenom" class="form-label">Prénom <span class="required">*</span></label>
                            <input type="text" id="prenom" name="prenom" class="form-input" placeholder="Votre prénom"
                                   required autocomplete="given-name" data-rule="text" data-msg="Le prénom est requis (min. 2 caractères)">
                            <span class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="nom" class="form-label">Nom <span class="required">*</span></label>
                            <input type="text" id="nom" name="nom" class="form-input" placeholder="Votre nom"
                                   required autocomplete="family-name" data-rule="text" data-msg="Le nom est requis (min. 2 caractères)">
                            <span class="field-error"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Adresse courriel <span class="required">*</span></label>
                        <input type="email" id="email" name="email" class="form-input" placeholder="exemple@courriel.com"
                               required autocomplete="email" data-rule="email" data-msg="Adresse courriel invalide">
                        <span class="field-error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="password" class="form-label">Mot de passe <span class="required">*</span></label>
                            <div class="password-wrapper">
                                <input type="password" id="password" name="password" class="form-input" placeholder="Mot de passe"
                                       required autocomplete="new-password" data-rule="password" data-msg="Minimum 8 caractères">
                                <button type="button" class="toggle-password" onclick="togglePassword('password', this)">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                            <span class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword" class="form-label">Confirmer <span class="required">*</span></label>
                            <div class="password-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Confirmer"
                                       required autocomplete="new-password" data-rule="confirm" data-msg="Les mots de passe ne correspondent pas">
                                <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="eye-off-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                            <span class="field-error"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="telephone" class="form-label">Téléphone <span class="required">*</span></label>
                        <input type="tel" id="telephone" name="telephone" class="form-input" placeholder="514-123-4567"
                               required autocomplete="tel" data-rule="tel" data-msg="Format attendu : 514-123-4567">
                        <span class="field-error"></span>
                    </div>

                    <div class="form-group">
                        <label for="adresse" class="form-label">Adresse <span class="required">*</span></label>
                        <input type="text" id="adresse" name="adresse" class="form-input" placeholder="123 Rue Exemple"
                               required autocomplete="street-address" data-rule="text" data-msg="L'adresse est requise (min. 2 caractères)">
                        <span class="field-error"></span>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="ville" class="form-label">Ville <span class="required">*</span></label>
                            <input type="text" id="ville" name="ville" class="form-input" placeholder="Montréal"
                                   required autocomplete="address-level2" data-rule="text" data-msg="La ville est requise (min. 2 caractères)">
                            <span class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="province" class="form-label">Province <span class="required">*</span></label>
                            <input type="text" id="province" name="province" class="form-input" placeholder="Québec"
                                   required autocomplete="address-level1" data-rule="text" data-msg="La province est requise (min. 2 caractères)">
                            <span class="field-error"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="postalCode" class="form-label">Code postal <span class="required">*</span></label>
                        <input type="text" id="postalCode" name="postalCode" class="form-input" placeholder="H2X 1Y4"
                               required autocomplete="postal-code" data-rule="postal" data-msg="Format attendu : H2X 1Y4">
                        <span class="field-error"></span>
                    </div>
                </fieldset>

                <!-- Section 2 : Choix du role -->
                <fieldset class="form-section">
                    <legend class="section-legend">Rôle</legend>
                    <div class="form-group">
                        <label for="role" class="form-label">Vous êtes <span class="required">*</span></label>
                        <div class="select-wrapper">
                            <select id="role" name="role" class="form-input form-select" required data-rule="select" data-msg="Veuillez sélectionner un rôle">
                                <option value="" disabled selected>— Choisir un rôle —</option>
                                <option value="PARENT">Parent</option>
                                <option value="ANIMATEUR">Animateur</option>
                            </select>
                        </div>
                        <span class="field-error"></span>
                    </div>
                </fieldset>

                <!-- Section 3 : Contact d'urgence (optionnel) -->
                <fieldset class="form-section">
                    <legend class="section-legend">Contact d'urgence (optionnel)</legend>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="urgenceNom" class="form-label">Nom complet</label>
                            <input type="text" id="urgenceNom" name="urgenceNom" class="form-input" placeholder="Nom complet" autocomplete="off">
                            <span class="field-error"></span>
                        </div>
                        <div class="form-group">
                            <label for="urgenceRelation" class="form-label">Relation</label>
                            <input type="text" id="urgenceRelation" name="urgenceRelation" class="form-input" placeholder="Ex: Parent, Conjoint" autocomplete="off">
                            <span class="field-error"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="urgenceTel" class="form-label">Téléphone d'urgence</label>
                        <input type="tel" id="urgenceTel" name="urgenceTel" class="form-input" placeholder="514-123-4567" autocomplete="off">
                        <span class="field-error"></span>
                    </div>
                </fieldset>

                <!-- Message d'erreur du serveur (Spring) -->
                <div th:if="${error}" class="register-error">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    <span th:text="${error}">Une erreur est survenue.</span>
                </div>

                <!-- Message d'erreur du JavaScript -->
                <div class="register-error" id="clientError" style="display:none">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    <span>Veuillez corriger les erreurs avant de continuer.</span>
                </div>

                <!-- Bouton desactive tant que le formulaire n'est pas valide -->
                <button type="submit" class="btn-register disabled" id="btnRegister" disabled>
                    Créer mon compte
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </button>
            </form>
        </div>
    </div>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script>
    // === VALIDATION JAVASCRIPT DU FORMULAIRE ===
    const $ = id => document.getElementById(id);
    const form = $('registerForm');
    const btn = $('btnRegister');
    const inputs = [...form.querySelectorAll('.form-input[data-rule]')];

    // Regles de validation pour chaque type de champ
    const rules = {
        text:     v => v.trim().length >= 2,
        email:    v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.trim()),
        password: v => v.length >= 8,
        confirm:  v => v.length > 0 && v === $('password').value,
        tel:      v => /^\d{3}-\d{3}-\d{4}$/.test(v.trim()),
        select:   v => v.length > 0,
        postal:   v => /^[A-Za-z]\d[A-Za-z][\s-]?\d[A-Za-z]\d$/.test(v.trim())
    };

    // Valider un champ et afficher l'erreur si necessaire
    function validate(input, showErr) {
        const ok = rules[input.dataset.rule](input.value);
        const err = input.closest('.form-group').querySelector('.field-error');

        if (showErr && !ok && input.value.length > 0) {
            input.classList.add('invalid');
            input.classList.remove('valid');
            err.textContent = input.dataset.msg;
        } else if (ok) {
            input.classList.add('valid');
            input.classList.remove('invalid');
            err.textContent = '';
        } else {
            input.classList.remove('valid', 'invalid');
            err.textContent = '';
        }
        return ok;
    }

    // Activer/desactiver le bouton selon la validite du formulaire
    function checkForm() {
        const allOk = inputs.every(i => rules[i.dataset.rule](i.value));
        btn.disabled = !allOk;
        btn.classList.toggle('disabled', !allOk);
        if (allOk) $('clientError').style.display = 'none';
    }

    // Ecouter les evenements sur chaque champ
    inputs.forEach(input => {
        input.addEventListener('input',  () => { validate(input, true); checkForm(); });
        input.addEventListener('change', () => { validate(input, true); checkForm(); });
        input.addEventListener('blur',   () => validate(input, true));
    });

    // Re-valider "confirmer" quand le mot de passe change
    $('password').addEventListener('input', () => {
        const c = $('confirmPassword');
        if (c.value.length > 0) { validate(c, true); checkForm(); }
    });

    // Verification AJAX : est-ce que le email existe deja ?
    $('email').addEventListener('blur', function() {
        const email = this.value.trim();
        if (!rules.email(email)) return;

        fetch('/inscription/check-email?email=' + encodeURIComponent(email))
            .then(r => r.json())
            .then(data => {
                const err = this.closest('.form-group').querySelector('.field-error');
                if (data.exists) {
                    this.classList.add('invalid');
                    this.classList.remove('valid');
                    err.textContent = 'Cette adresse courriel est déjà utilisée.';
                }
            });
    });

    // Empecher la soumission si le formulaire n'est pas valide
    form.addEventListener('submit', e => {
        let ok = true;
        inputs.forEach(i => { if (!validate(i, true)) ok = false; });
        if (!ok) {
            e.preventDefault();
            $('clientError').style.display = 'flex';
            form.querySelector('.form-input.invalid')?.focus();
        }
    });

    // Afficher/cacher le mot de passe
    function togglePassword(id, toggleBtn) {
        const input = $(id);
        input.type = input.type === 'password' ? 'text' : 'password';
        toggleBtn.querySelector('.eye-icon').classList.toggle('hidden');
        toggleBtn.querySelector('.eye-off-icon').classList.toggle('hidden');
    }
</script>
</body>
</html>

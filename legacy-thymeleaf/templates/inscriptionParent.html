<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Inscriptions — Manara</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboardParent.css}">
    <link rel="stylesheet" th:href="@{/css/inscriptionParent.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="dashboard-layout">
    <div th:replace="fragments/sidebar :: sidebar('inscriptions')"></div>

    <main class="dashboard-main">
        <div class="inscriptions-header">
            <h1 class="inscriptions-title">Mes Inscriptions</h1>
            <a th:href="@{/dashboardParent/activites}" class="btn-inscrire-activite">+ Inscrire à une activité</a>
        </div>

        <!-- Message succes apres inscription -->
        <div th:if="${param.inscrit}" class="alert-success">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            <span>Inscription effectuée avec succès !</span>
        </div>

        <!-- Message annulation en rouge -->
        <div th:if="${param.annule}" class="alert-annule">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#c62828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
            </svg>
            <span>Inscription annulée avec succès.</span>
        </div>

        <!-- Si aucun enfant enregistre -->
        <div th:if="${children == null or children.isEmpty()}" class="empty-state">
            <p>Aucun enfant enregistré. <a th:href="@{/dashboardParent/enfants}">Ajouter un enfant</a></p>
        </div>

        <!-- Boucle par enfant : afficher ses inscriptions -->
        <div th:if="${children != null and !children.isEmpty()}">
            <div th:each="child : ${children}" class="enfant-section">
                <div class="enfant-section-header">
                    <h2 class="enfant-section-nom" th:text="${child.firstName + ' ' + child.lastName}">Enfant</h2>
                </div>
                <div class="inscriptions-grid">

                    <th:block th:with="hasInscription=false">
                        <th:block th:each="reg : ${registrations}">
                            <!-- Afficher seulement les inscriptions non-annulees de cet enfant -->
                            <div class="inscription-card"
                                 th:if="${reg.child != null and reg.child.id == child.id and reg.status != 'Annulé' and reg.status != 'ANNULÉ'}">

                                <!-- Statut avec couleur -->
                                <span class="inscription-statut"
                                      th:classappend="${reg.status == 'CONFIRMÉ' or reg.status == 'Confirmé' ? 'confirmed' : (reg.status == 'EN_ATTENTE' or reg.status == 'En attente' ? 'pending' : (reg.status == 'ANNULÉ' or reg.status == 'Annulé' ? 'cancelled' : ''))}"
                                      th:text="${reg.status}">Statut</span>

                                <!-- Nom de l'activite -->
                                <h3 class="inscription-nom"
                                    th:text="${reg.activitySession.activity.name}">Activité</h3>

                                <!-- Date et lieu -->
                                <p class="inscription-details">
                                    <span th:text="${#temporals.format(reg.activitySession.dateTimeStart, 'dd MMM yyyy')}">Date</span>
                                    <br>
                                    <span th:if="${reg.activitySession.location != null}"
                                          th:text="'📍 ' + ${reg.activitySession.location.name}">Lieu</span>
                                </p>

                                <!-- Bouton annuler -->
                                <div class="inscription-actions">
                                    <form th:action="@{/dashboardParent/inscriptions/annuler}" method="post">
                                        <input type="hidden" name="registrationId" th:value="${reg.id}">
                                        <button type="submit" class="btn-annuler-inscription"
                                                onclick="return confirm('Voulez-vous vraiment annuler cette inscription ?')">
                                            Annuler
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </th:block>
                    </th:block>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<!-- Bouton menu mobile -->
<button class="mobile-menu-btn" onclick="toggleSidebar()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.sidebar-overlay').classList.toggle('open');
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Profil — Manara</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/dashboardParent.css}">
  <link rel="stylesheet" th:href="@{/css/profil.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="dashboard-layout">

  <div th:replace="fragments/sidebar :: sidebar('profil')"></div>

  <main class="dashboard-main">
    <h1 class="profil-title">Mon Profil</h1>

    <!-- Message de succès -->
    <div th:if="${param.modif}" class="alert-success">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span>Profil modifié avec succès !</span>
    </div>

    <form th:action="@{/dashboardParent/profil/modifier}" method="post" id="profilForm">

      <div class="profil-grid">
        <div class="profil-card">
          <div class="profil-card-header">
            <h2 class="profil-card-title">Informations personnelles</h2>
            <button type="button" class="btn-modifier-profil" onclick="toggleEdit()">Modifier</button>
          </div>
          <div class="profil-fields" id="profilFields">
            <div class="profil-field">
              <span class="field-label">Prénom</span>
              <span class="field-value" th:text="${user.firstName}">Prénom</span>
              <input type="text" class="field-input hidden" name="firstName" th:value="${user.firstName}">
            </div>
            <div class="profil-field">
              <span class="field-label">Nom</span>
              <span class="field-value" th:text="${user.lastName}">Nom</span>
              <input type="text" class="field-input hidden" name="lastName" th:value="${user.lastName}">
            </div>
            <div class="profil-field">
              <span class="field-label">Courriel</span>
              <span class="field-value" th:text="${user.email}">email</span>
              <input type="email" class="field-input hidden" name="email" th:value="${user.email}">
            </div>
            <div class="profil-field">
              <span class="field-label">Téléphone</span>
              <span class="field-value" th:text="${parentProfile?.phoneNumber} ?: 'Non renseigné'">Téléphone</span>
              <input type="tel" class="field-input hidden" name="phoneNumber" th:value="${parentProfile?.phoneNumber}">
            </div>
          </div>
        </div>

        <div class="profil-card">
          <div class="profil-card-header">
            <h2 class="profil-card-title">Coordonnées</h2>
          </div>
          <div class="profil-fields" id="coordFields">
            <div class="profil-field">
              <span class="field-label">Adresse</span>
              <span class="field-value" th:text="${parentProfile?.addressLine1} ?: 'Non renseigné'">Adresse</span>
              <input type="text" class="field-input hidden" name="addressLine1" th:value="${parentProfile?.addressLine1}">
            </div>
            <div class="profil-field">
              <span class="field-label">Ville</span>
              <span class="field-value" th:text="${parentProfile?.city} ?: 'Non renseigné'">Ville</span>
              <input type="text" class="field-input hidden" name="city" th:value="${parentProfile?.city}">
            </div>
            <div class="profil-field">
              <span class="field-label">Province</span>
              <span class="field-value" th:text="${parentProfile?.province} ?: 'Non renseigné'">Province</span>
              <input type="text" class="field-input hidden" name="province" th:value="${parentProfile?.province}">
            </div>
          </div>
        </div>
      </div>

      <div class="profil-card full-width">
        <div class="profil-card-header">
          <h2 class="profil-card-title">Contact d'urgence</h2>
        </div>
        <div class="urgence-grid" id="urgenceFields">
          <div class="profil-field">
            <span class="field-label">Nom complet</span>
            <span class="field-value" th:text="${parentProfile?.emergencyName} ?: 'Non renseigné'">Nom</span>
            <input type="text" class="field-input hidden" name="emergencyName" th:value="${parentProfile?.emergencyName}">
          </div>
          <div class="profil-field">
            <span class="field-label">Relation</span>
            <span class="field-value" th:text="${parentProfile?.emergencyRelationship} ?: 'Non renseigné'">Relation</span>
            <input type="text" class="field-input hidden" name="emergencyRelationship" th:value="${parentProfile?.emergencyRelationship}">
          </div>
          <div class="profil-field">
            <span class="field-label">Téléphone</span>
            <span class="field-value" th:text="${parentProfile?.emergencyPhone} ?: 'Non renseigné'">Téléphone</span>
            <input type="tel" class="field-input hidden" name="emergencyPhone" th:value="${parentProfile?.emergencyPhone}">
          </div>
        </div>
      </div>

      <div class="profil-edit-buttons hidden" id="editButtons">
        <button type="submit" class="btn-save">Enregistrer</button>
        <button type="button" class="btn-cancel" onclick="cancelEdit()">Annuler</button>
      </div>

    </form>
  </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<button class="mobile-menu-btn" onclick="toggleSidebar()">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
  let isEditing = false;
  const $$ = sel => document.querySelectorAll(sel);
  const $ = id => document.getElementById(id);

  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }

  function setEditMode(editing) {
    isEditing = editing;
    $$('.field-value').forEach(el => el.classList.toggle('hidden', editing));
    $$('.field-input').forEach(el => el.classList.toggle('hidden', !editing));
    $('editButtons').classList.toggle('hidden', !editing);
    document.querySelector('.btn-modifier-profil').classList.toggle('hidden', editing);
  }

  function toggleEdit() { setEditMode(true); }

  function cancelEdit() {
    $$('.field-input').forEach(input => {
      const val = input.closest('.profil-field').querySelector('.field-value');
      input.value = val.textContent !== 'Non renseigné' ? val.textContent : '';
    });
    setEditMode(false);
  }
</script>
</body>
</html>

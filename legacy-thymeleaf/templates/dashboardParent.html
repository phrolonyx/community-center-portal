<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Parent — Manara</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboardParent.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="dashboard-layout">

    <div th:replace="fragments/sidebar :: sidebar('apercu')"></div>

    <main class="dashboard-main">

        <!-- Message de bienvenue avec le prenom du parent connecte -->
        <div class="welcome-card">
            <h1>Bonjour, <span th:text="${user.firstName}">Prénom</span> ! <span class="wave-emoji">👋</span></h1>
            <p>Bienvenue dans votre espace parent. Voici un aperçu rapide.</p>
        </div>

        <div class="overview-grid">
            <!-- Section : Liste des enfants -->
            <div class="section-card">
                <div class="section-header">
                    <h2 class="section-title">Mes enfants</h2>
                    <a th:href="@{/dashboardParent/enfants}" class="section-link">Gérer →</a>
                </div>
                <div id="enfantsContainer">
                    <!-- Afficher les enfants du parent -->
                    <div th:if="${children != null and !children.isEmpty()}">
                        <div th:each="child : ${children}" class="activity-item">
                            <div class="activity-info">
                                <strong th:text="${child.firstName + ' ' + child.lastName}">Enfant</strong>
                                <span th:text="'Né(e) le ' + ${child.dateOfBirth != null ? child.dateOfBirth.toLocalDate() : 'N/A'}">Date</span>
                            </div>
                        </div>
                    </div>
                    <!-- Si aucun enfant -->
                    <div th:if="${children == null or children.isEmpty()}">
                        <p class="empty-msg">Aucun enfant enregistré. <a th:href="@{/dashboardParent/enfants}">Ajouter un enfant</a></p>
                    </div>
                </div>
            </div>

            <!-- Section : Notifications -->
            <div class="section-card">
                <div class="section-header">
                    <h2 class="section-title">Notifications</h2>
                    <a th:href="@{/dashboardParent/messages}" class="section-link">Voir tout →</a>
                </div>
                <div id="notifsContainer">
                    <p class="empty-msg">Aucune notification pour le moment.</p>
                </div>
            </div>
        </div>

        <!-- Section : Calendrier -->
        <div class="section-card">
            <div class="section-header">
                <h2 class="section-title" id="calendarTitle">Calendrier</h2>
                <div class="calendar-nav">
                    <button class="cal-nav-btn" onclick="changeMonth(-1)">←</button>
                    <button class="cal-nav-btn" onclick="changeMonth(1)">→</button>
                </div>
            </div>
            <table class="calendar-table">
                <thead><tr><th>Lun</th><th>Mar</th><th>Mer</th><th>Jeu</th><th>Ven</th><th>Sam</th><th>Dim</th></tr></thead>
                <tbody id="calendarBody"></tbody>
            </table>
            <div class="calendar-legend" id="calendarLegend"></div>
        </div>
    </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<!-- Bouton menu mobile -->
<button class="mobile-menu-btn" onclick="toggleSidebar()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
    // === CALENDRIER JAVASCRIPT ===
    const MOIS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const now = new Date();
    let currentMonth = now.getMonth(), currentYear = now.getFullYear();

    const $ = id => document.getElementById(id);

    // Ouvrir/fermer le menu lateral sur mobile
    function toggleSidebar() {
        document.querySelector('.sidebar').classList.toggle('open');
        document.querySelector('.sidebar-overlay').classList.toggle('open');
    }

    // Changer de mois dans le calendrier
    function changeMonth(dir) {
        currentMonth += dir;
        if (currentMonth > 11) { currentMonth = 0; currentYear++; }
        if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
        renderCalendar();
    }

    // Generer le calendrier du mois courant
    function renderCalendar() {
        $('calendarTitle').textContent = `Calendrier — ${MOIS[currentMonth]} ${currentYear}`;

        const startDay = (new Date(currentYear, currentMonth, 1).getDay() + 6) % 7;
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        let cells = Array(startDay).fill('<td></td>');
        for (let d = 1; d <= totalDays; d++) {
            cells.push(`<td>${d}</td>`);
        }
        while (cells.length % 7 !== 0) cells.push('<td></td>');

        const rows = [];
        for (let i = 0; i < cells.length; i += 7) rows.push(`<tr>${cells.slice(i, i + 7).join('')}</tr>`);
        $('calendarBody').innerHTML = rows.join('');

        $('calendarLegend').style.display = 'none';
    }

    document.addEventListener('DOMContentLoaded', () => { renderCalendar(); });
</script>
</body>
</html>

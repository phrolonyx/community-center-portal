<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages — Manara</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/dashboardParent.css}">
  <link rel="stylesheet" th:href="@{/css/messages.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="dashboard-layout">
  <div th:replace="fragments/sidebar :: sidebar('messages')"></div>

  <main class="dashboard-main">
    <div class="messages-header">
      <h1 class="messages-title">Messages</h1>
      <span class="messages-count" th:text="${#lists.size(messages)} + ' message(s)'">0 messages</span>
      <span th:if="${unreadCount > 0}" class="unread-badge" th:text="${unreadCount} + ' non lu(s)'"></span>
    </div>

    <!-- Liste des messages -->
    <div th:if="${!messages.isEmpty()}" class="messages-list">
      <div th:each="msg : ${messages}"
           th:classappend="${!msg.isRead} ? ' unread' : ''"
           class="message-card" onclick="toggleMessage(this)">

        <div class="message-top">
          <div class="message-sender">
            <div class="sender-avatar admin" th:text="${msg.senderInitials}">AD</div>
            <div class="sender-info">
              <strong th:text="${msg.sender.fullName}">Admin</strong>
              <span class="sender-role">
                <span class="type-badge"
                      th:classappend="${msg.type == 'ANNULATION'} ? ' annulation' : (${msg.type == 'RAPPEL'} ? ' rappel' : ' annonce')"
                      th:text="${msg.type}">ANNONCE</span>
              </span>
            </div>
          </div>
          <div class="message-meta">
            <span class="message-date" th:text="${#temporals.format(msg.createdAt, 'dd MMM yyyy HH:mm')}">01 avr 2026</span>
            <span th:if="${!msg.isRead}" class="unread-dot"></span>
          </div>
        </div>

        <p class="message-subject" th:text="${msg.subject}">Sujet du message</p>
        <p class="message-preview" th:text="${msg.content}">Apercu du message...</p>

        <div class="message-expanded">
          <p th:utext="${msg.content}"></p>
          <form th:if="${!msg.isRead}" th:action="@{/dashboardParent/messages/lire}" method="post" style="margin-top:12px;">
            <input type="hidden" name="messageId" th:value="${msg.id}">
            <button type="submit" class="btn-mark-read">Marquer comme lu</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Aucun message -->
    <div th:if="${messages.isEmpty()}" class="messages-empty">
      <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#C8CDD3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <h2>Aucune notification pour le moment</h2>
      <p>Vos messages et notifications apparaitront ici.</p>
    </div>
  </main>
</div>

<div th:replace="fragments/footer :: footer"></div>

<button class="mobile-menu-btn" onclick="toggleSidebar()">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
  </svg>
</button>
<div class="sidebar-overlay" onclick="toggleSidebar()"></div>

<script>
  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
    document.querySelector('.sidebar-overlay').classList.toggle('open');
  }
  function toggleMessage(card) {
    card.classList.toggle('open');
  }
</script>
</body>
</html>

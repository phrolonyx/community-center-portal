# Lance toute l'application : docker compose up --build
#   Application : http://localhost:8080
#   Courriels   : http://localhost:8025 (Mailpit capte tous les envois)
# Les variables viennent du fichier .env (copier .env.example en .env).

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      MYSQL_DATABASE: manara_db
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # Le backend attend que MySQL réponde avant de démarrer
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Faux serveur SMTP : aucun courriel ne quitte la machine,
  # ils s'affichent tous dans l'interface web
  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      # Mêmes variables que application.properties : seule l'URL change,
      # car MySQL est joignable par le nom du service "db"
      DB_URL: jdbc:mysql://db:3306/manara_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      # Courriels envoyés à Mailpit (sans authentification ni chiffrement)
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_AUTH: "false"
      MAIL_STARTTLS: "false"
      MAIL_USERNAME: noreply@centre-communautaire.local
      SPRING_JPA_SHOW_SQL: "false"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db-data:
  uploads:

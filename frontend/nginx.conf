# Derrière Caddy, la connexion vers nginx est en HTTP : $scheme vaut "http".
# On transmet plutôt le protocole d'origine annoncé par Caddy (https),
# et $scheme seulement si aucun proxy n'est devant (développement local).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Taille maximale des téléversements (images de profil, d'activités)
    client_max_body_size 10M;

    # Remplace proxy.conf.json : /api est relayé au backend.
    # Le préfixe /api est conservé, car Spring utilise context-path=/api.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Routage Angular : toute route inconnue renvoie index.html
    # (sinon un rafraîchissement sur /connexion donnerait une 404)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<div class="admin-gestion-des">

  <!-- SIDEBAR -->
  <app-animateur-sidebar></app-animateur-sidebar>

  <!-- MAIN -->
  <main class="main-content">

    <!-- HEADER -->
    <app-animateur-header title="Mes séances"></app-animateur-header>

    <div class="content-main">

      <!-- TABLEAU -->
      <section class="users-table">

        <table class="users-table-grid">
          <thead>
            <tr>
              <th>Activité</th>
              <th>Lieu</th>
              <th>Capacité</th>
              <th>Date début</th>
              <th>Date fin</th>
              <th>Détails</th>
            </tr>
          </thead>

          <tbody>

            @for (session of sessionsParAnimateur(); track session.id) {
              <tr>
                <td>{{ session.activityName }}</td>
                <td>{{ session.locationName }}</td>
                <td>{{ session.capacity }}</td>

                <td>{{ session.dateTimeStart | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>{{ session.dateTimeEnd | date:'dd/MM/yyyy HH:mm' }}</td>

                <td>
                  <button class="btn-delete"
                          [routerLink]="['/animateur/sceances/details', session.id]">
                    Détails
                  </button>
                </td>
              </tr>
            }

          </tbody>

        </table>

      </section>

    </div>
  </main>
</div>

<nav class="sidebar-container" aria-label="Navigation principale">

  <h1 class="text-wrapper">Compte Animateur</h1>

  <ul class="nav-menu">
    <li class="sidebar-children">
      <a routerLink="/animateur/enfants">Enfants</a>
    </li>
    <li class="sidebar-sessions">
      <a routerLink="/animateur/sceances">Séances</a>
    </li>
    <li class="sidebar-sessions">
      <a routerLink="/animateur/messages">Envoyer message</a>
    </li>
    <li class="sidebar-sessions">
      <a routerLink="/animateur/inbox">
        Boîte de réception
        <span *ngIf="nonLus > 0" class="badge-nonlus">{{ nonLus }}</span>
      </a>
    </li>
    <li class="sidebar-sessions">
      <a routerLink="/animateur/messages-envoyes">Messages envoyés</a>
    </li>
  </ul>

  <div class="settings-footer">
    <img class="settings"
         id="admin-icon"
         src="assets/images/icons8-admin-settings-male-64.png"
         alt="Admin"
         (click)="toggleLogout()" />

    <span class="text-wrapper-6">{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>

  <div id="logout-popup" class="logout-popup" [style.display]="logoutOpen ? 'block' : 'none'">

    <button class="btn-outline" routerLink="">Accueil</button>

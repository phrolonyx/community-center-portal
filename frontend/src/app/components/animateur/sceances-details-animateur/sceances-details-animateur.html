<div class="admin-gestion-des">

  <!-- SIDEBAR -->
  <app-animateur-sidebar></app-animateur-sidebar>

  <!-- MAIN -->
  <main class="main-content content-main">

    <app-animateur-header title="Details d'un séance"></app-animateur-header>

    <div class="details-container">

      <!-- CADRE 1 : Activité -->
      <div class="details-card form-modern">
        <div class="form-group">

          <div class="info-row">
            <label>Activité</label>
            <div class="value">Yoga détente</div>
          </div>

          <div class="info-row">
            <label>Lieu</label>
            <div class="value">Centre sportif – Salle 2</div>
          </div>

          <div class="info-row">
            <label>Capacité</label>
            <div class="value">20 personnes</div>
          </div>

          <div class="info-row">
            <label>Âge minimum</label>
            <div class="value">12 ans</div>
          </div>

          <div class="info-row">
            <label>Date de début</label>
            <div class="value">12/05/2024 – 18:00</div>
          </div>

          <div class="info-row">
            <label>Date de fin</label>
            <div class="value">12/05/2024 – 19:30</div>
          </div>

        </div>
      </div>


      <!-- CADRE 2 : Enfants inscrits -->
      <div class="details-card form-modern">
        <div class="form-group">
          <label>Enfants Inscrits</label>
          <div>Emilie Lavoie</div>
        </div>
      </div>

    </div>

  </main>

</div>

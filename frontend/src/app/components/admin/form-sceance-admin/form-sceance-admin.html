<div class="admin-gestion-des">

  <!-- SIDEBAR -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- MAIN -->
  <main class="main-content">

    <!-- HEADER -->
    <app-admin-header title="Ajouter une séance"></app-admin-header>

    <div class="content-main">

      <section class="users-table">

        <form class="admin-form form-modern" (submit)="saveSession()">

          <!-- ID (si édition) -->
          <input type="hidden" [(ngModel)]="session.id" name="id" />

          <!-- ACTIVITÉ -->
          <div class="form-group">
            <label>Activité</label>

            <select
              class="input-modern"
              [(ngModel)]="session.activityId"
              name="activityId"
              required>

              <option value="">-- Choisir une activité --</option>

              <!-- Liste dynamique API -->
              <!-- <option *ngFor="let a of activities" [value]="a.id">
                {{ a.name }}
              </option> -->

            </select>
          </div>

          <!-- ANIMATEUR -->
          <div class="form-group">
            <label>Animateur</label>

            <select
              class="input-modern"
              [(ngModel)]="session.hostId"
              name="hostId"
              required>

              <option value="">-- Choisir un animateur --</option>
<!-- 
              <option *ngFor="let h of hosts" [value]="h.id">
                {{ h.fullName }}
              </option> -->

            </select>
          </div>

          <!-- LIEU -->
          <div class="form-group">
            <label>Lieu</label>

            <select
              class="input-modern"
              [(ngModel)]="session.locationId"
              name="locationId"
              required>

              <option value="">-- Choisir un lieu --</option>
<!-- 
              <option *ngFor="let l of locations" [value]="l.id">
                {{ l.name }}
              </option> -->

            </select>
          </div>

          <!-- CAPACITÉ -->
          <div class="form-group">
            <label>Capacité</label>
            <input
              type="number"
              class="input-modern"
              min="1"
              [(ngModel)]="session.capacity"
              name="capacity"
              required
            />
          </div>

          <!-- ÂGE MIN -->
          <div class="form-group">
            <label>Âge minimum</label>
            <input
              type="number"
              class="input-modern"
              min="0"
              max="18"
              [(ngModel)]="session.minAge"
              name="minAge"
              placeholder="Ex: 4"
            />
          </div>

          <!-- ÂGE MAX -->
          <div class="form-group">
            <label>Âge maximum</label>
            <input
              type="number"
              class="input-modern"
              min="0"
              max="18"
              [(ngModel)]="session.maxAge"
              name="maxAge"
              placeholder="Ex: 12"
            />
          </div>

          <!-- DATE DÉBUT -->
          <div class="form-group">
            <label>Date de début</label>
            <input
              type="datetime-local"
              class="input-modern"
              [(ngModel)]="session.dateTimeStart"
              name="dateTimeStart"
              required
            />
          </div>

          <!-- DATE FIN -->
          <div class="form-group">
            <label>Date de fin</label>
            <input
              type="datetime-local"
              class="input-modern"
              [(ngModel)]="session.dateTimeEnd"
              name="dateTimeEnd"
              required
            />
          </div>

          <!-- BOUTONS -->
          <div class="form-actions">
            <a routerLink="/admin/sceances" class="btn-edit">Annuler</a>
            <button type="submit" class="btn-edit">Enregistrer</button>
          </div>

        </form>

      </section>

    </div>
  </main>
</div>

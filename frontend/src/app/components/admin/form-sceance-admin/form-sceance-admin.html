<div class="admin-gestion-des">

  <!-- SIDEBAR -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- MAIN -->
  <main class="main-content">

    <!-- HEADER -->
    <app-admin-header [title]="formTitle()"></app-admin-header>

    <div class="content-main">

      <section class="users-table">

        @if (loading()) {
          <div class="loader-wrapper">
            <p>Chargement...</p>
          </div>
        } @else {

          <form class="admin-form form-modern" (submit)="saveSession()">

            <!-- ID (si édition) -->
            <input type="hidden" [(ngModel)]="form.id" name="id" />

            <!-- ACTIVITÉ -->
            <div class="form-group">
              <label>Activité</label>

              @if (loadingActivities()) {
                <p>Chargement des activités...</p>
              } @else {
                <select
                  class="input-modern"
                  [(ngModel)]="form.activityId"
                  name="activityId"
                  required>

                  <option value="">-- Choisir une activité --</option>

                  @for (a of activities; track a.id) {
                    <option [value]="a.id">
                      {{ a.name }}
                    </option>
                  }

                </select>
              }
            </div>

            <!-- ANIMATEUR -->
            <div class="form-group">
              <label>Animateur</label>

              <select
                class="input-modern"
                [(ngModel)]="form.hostId"
                name="hostId"
                required>

                <option value="">-- Choisir un animateur --</option>

                @for (h of hosts; track h.id) {
                  <option [value]="h.id">
                    {{ h.firstName }} {{ h.lastName }}
                  </option>
                }

              </select>
            </div>

            <!-- LIEU -->
            <div class="form-group">
              <label>Lieu</label>

              <select
                class="input-modern"
                [(ngModel)]="form.locationId"
                name="locationId"
                required>

                <option value="">-- Choisir un lieu --</option>

                @for (l of locations; track l.id) {
                  <option [value]="l.id">
                    {{ l.name }}
                  </option>
                }

              </select>
            </div>

            <!-- CAPACITÉ -->
            <div class="form-group">
              <label>Capacité</label>
              <input
                type="number"
                class="input-modern"
                min="1"
                [(ngModel)]="form.capacity"
                name="capacity"
                required
              />
            </div>

            <!-- ÂGE MIN -->
            <div class="form-group">
              <label>Âge minimum</label>
              <input
                type="number"
                class="input-modern"
                min="0"
                max="18"
                [(ngModel)]="form.minAge"
                name="minAge"
                placeholder="Ex: 4"
              />
            </div>

            <!-- ÂGE MAX -->
            <div class="form-group">
              <label>Âge maximum</label>
              <input
                type="number"
                class="input-modern"
                min="0"
                max="18"
                [(ngModel)]="form.maxAge"
                name="maxAge"
                placeholder="Ex: 12"
              />
            </div>

            <!-- DATE DÉBUT -->
            <div class="form-group">
              <label>Date de début</label>
              <input
                type="datetime-local"
                class="input-modern"
                [(ngModel)]="form.dateTimeStart"
                name="dateTimeStart"
                required
              />
            </div>

            <!-- DATE FIN -->
            <div class="form-group">
              <label>Date de fin</label>
              <input
                type="datetime-local"
                class="input-modern"
                [(ngModel)]="form.dateTimeEnd"
                name="dateTimeEnd"
                required
              />
            </div>

            <!-- BOUTONS -->
            <div class="form-actions">
              <a routerLink="/admin/sceances" class="btn-edit">Annuler</a>
              <button type="submit" class="btn-edit">Enregistrer</button>
            </div>

          </form>

        }

      </section>

    </div>
  </main>
</div>

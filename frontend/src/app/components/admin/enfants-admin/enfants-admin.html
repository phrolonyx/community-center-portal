<div class="admin-gestion-des">

  <!-- SIDEBAR -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- MAIN -->
  <main class="main-content">

    <!-- HEADER -->
    <app-admin-header title="Gestion des enfants"></app-admin-header>

    <div class="content-main">

      <!-- BARRE DE RECHERCHE -->
      <form class="content-searchbar" (submit)="searchChildren()">

        <img class="filter" src="assets/images/icons8-filter-96.png" alt="Filtrer" />

        <input
          type="text"
          class="search-input"
          placeholder="Rechercher un enfant..."
          [(ngModel)]="searchValue"
          name="search"
        />

        <button type="submit" class="search-btn">
          <img class="search" src="assets/images/icons8-search-150.png" alt="Rechercher" />
        </button>

      </form>

      <!-- TABLEAU ENFANTS -->
      <section class="users-table">
        <table class="users-table-grid">
          <thead>
            <tr>
              <th>Nom complet</th>
              <th>Parent(s)</th>
              <th>Date de naissance</th>
              <th>Âge</th>
              <th>Conditions médicales</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody>

            <!-- BOUCLE DYNAMIQUE API -->

              <!-- Nom complet -->

              <!-- Parents -->

                  {{ link.parentName }}

              <!-- Âge -->

                <!-- <span *ngIf="child.medicalConditions.length === 0">Aucune</span> -->

                <!-- <span *ngFor="let cond of child.medicalConditions" style="display:block;">
                  {{ cond }}

    </div>
  </main>
</div>

<nav class="sidebar-container" aria-label="Navigation principale">

  <h1 class="text-wrapper">Compte Administrateur</h1>

  <ul class="nav-menu">
    <li class="sidebar-location">
      <a routerLink="/admin/dashboard">Tableau de bord</a>
    </li>
    <li class="sidebar-users">
      <a routerLink="/admin/users">Utilisateurs</a>
    </li>
    <li class="sidebar-children">
      <a routerLink="/admin/enfants">Enfants</a>
    </li>
    <li class="sidebar-activities">
      <a routerLink="/admin/activites">Activités</a>
    </li>
    <li class="sidebar-sessions">
      <a routerLink="/admin/sceances">Séances</a>
    </li>
    <li class="sidebar-messages">
      <a routerLink="/admin/messages">Envoyer message</a>
    </li>
    <li class="sidebar-messages">
      <a routerLink="/admin/inbox">
        Boîte de réception
        <span *ngIf="nonLus > 0" class="badge-nonlus">{{ nonLus }}</span>
      </a>
    </li>
    <li class="sidebar-messages">
      <a routerLink="/admin/messages-envoyes">Messages envoyés</a>
    </li>
  </ul>

  <div class="settings-footer">
    <img class="settings"
         id="admin-icon"
         src="assets/images/icons8-admin-settings-male-64.png"
         alt="Admin"
         (click)="toggleLogout()" />
    <span class="text-wrapper-6">
      {{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}
    </span>
  </div>

  <div id="logout-popup" class="logout-popup" [style.display]="logoutOpen ? 'block' : 'none'">
    <button class="logout-btn" (click)="logout()">Déconnexion</button>
    <button class="btn-outline" routerLink="">Accueil</button>
  </div>

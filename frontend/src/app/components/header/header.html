<header>
  <nav class="navbar">

    <!-- Logo -->
    <div class="logo">
      <a routerLink="/">
        <img src="assets/images/logo.png" alt="Logo du site">
      </a>
    </div>

    <!-- Navigation principale -->
    <ul class="nav-links">
      <li><a routerLink="/">Accueil</a></li>
      <li><a [routerLink]="lienActivites()">Nos activités</a></li>
    </ul>

    <!-- Boutons selon l'état de connexion -->
    <div class="nav-buttons">

      <!-- Utilisateur NON connecté -->
      @if (!authService.isAuthenticated()) {
        <a routerLink="/connexion" class="btn-outline">Connexion</a>
        <a routerLink="/inscription" class="btn-filled">Inscription</a>
      }

      <!-- Utilisateur connecté — menu profil -->
      @if (authService.isAuthenticated()) {
        <div class="profile-container" [class.active]="menuOuvert">

          <div class="profile-trigger" (click)="menuOuvert = !menuOuvert">
            <span>{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>
            <img src="assets/images/profileIcon.png" alt="Profil" class="profile-icon">
          </div>

          @if (menuOuvert) {
            <div class="profile-menu">
              <a (click)="allerAuDashboard(); menuOuvert = false" style="cursor:pointer">
                Mon espace
              </a>
              <a (click)="logout()" style="cursor:pointer">
                Déconnexion
              </a>
            </div>
          }

        </div>
      }

    </div>

  </nav>
</header>
